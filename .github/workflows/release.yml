name: Release

on:
  workflow_dispatch:
  release:
    types: [ published ]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: release
      VERSION_TYPE: ${{ github.event.release.prerelease && 'beta' || 'release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read gradle.properties
        id: properties
        shell: bash
        run: |
          read_prop() {
            grep -E "^$1=" gradle.properties | head -n 1 | cut -d= -f2- | xargs
          }
          {
            echo "mod_id=$(read_prop mod_id)"
            echo "mod_name=$(read_prop mod_name)"
            echo "java_version=$(read_prop java_version)"
            echo "minecraft_version=$(read_prop minecraft_version)"
            echo "modrinth_id=$(read_prop modrinth_id)"
            echo "curseforge_id=$(read_prop curseforge_id)"
            echo "upload=$(read_prop upload)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Java ${{ steps.properties.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ steps.properties.outputs.java_version }}

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -x test --stacktrace

      - name: Resolve artifact
        id: artifact
        shell: bash
        run: |
          JAR=$(ls build/libs/*.jar \
            | grep -v -- '-sources' \
            | grep -v -- '-shadow' \
            | grep -v -- '-slim' \
            | head -n 1)
          if [ -z "$JAR" ] || [ ! -f "$JAR" ]; then
            echo "no jar produced in build/libs" >&2
            ls -l build/libs >&2 || true
            exit 1
          fi
          VERSION=$(basename "$JAR" .jar)
          VERSION=${VERSION#"${{ steps.properties.outputs.mod_id }}-neoforge-"}
          SOURCES=$(ls build/libs/*-sources.jar 2>/dev/null | head -n 1)
          if [ -n "$SOURCES" ]; then
            echo "sources=$SOURCES" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          NAME=$(echo "${{ steps.properties.outputs.mod_name }} $VERSION" | sed 's/["\\:<>|*?\/]//g')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.artifact.outputs.name }}"
          path: |
            ${{ steps.artifact.outputs.jar }}
            ${{ steps.artifact.outputs.sources }}
          if-no-files-found: error

      - name: Publish to maven
        if: steps.properties.outputs.upload == 'true'
        continue-on-error: true
        run: ./gradlew publish
        env:
          MAVEN_URL: ${{ secrets.MAVEN_URL }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASS }}

      - name: Upload GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifact.outputs.jar }}
            ${{ steps.artifact.outputs.sources }}

      - name: Publish to Modrinth and CurseForge
        if: steps.properties.outputs.upload == 'true'
        continue-on-error: true
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: "${{ steps.properties.outputs.mod_name }} For NeoForge v${{ steps.artifact.outputs.version }}"
          version: ${{ steps.artifact.outputs.version }}
          version-type: ${{ env.VERSION_TYPE }}
          changelog: ${{ github.event.release.body || format('{0} {1}', steps.properties.outputs.mod_name, steps.artifact.outputs.version) }}
          loaders: neoforge
          game-versions: ${{ steps.properties.outputs.minecraft_version }}
          java: ${{ steps.properties.outputs.java_version }}
          fail-mode: skip
          retry-attempts: 3

          modrinth-id: ${{ steps.properties.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true

          curseforge-id: ${{ steps.properties.outputs.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          dependencies: |
            anvilcraft@1.21.1-1.6.0+snapshot.2624(required){modrinth:vuISAWPc}{curseforge:986251}

          files: |
            ${{ steps.artifact.outputs.jar }}
            ${{ steps.artifact.outputs.sources }}
